<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>comory — élève</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="comory élève">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Android / Chrome theme -->
    <meta name="theme-color" content="#E8E3DD">
    <link rel="stylesheet" href="leCSS.css">
    <style>
        /* ── Mode élève : masquer les éléments enseignant ── */
        .desktop-version,
        .mobile-version,
        .cote-gauche,
        .super-conteneur-gauche,
        .tableau-carrousel,
        .header-wrapper,
        .barre-outils-bas,
        .barre-outils-droite,
        .carrousel-zone,
        #archive-overlay,
        #sync-dot,
        #btn-archive,
        #conteneur-fichier,
        #btn-mobile-logo,
        .socket-bouton,
        .top-bar,
        #roue-panel {
            display: none !important;
        }

        /* Canvas plein écran */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg, #E8E3DD);
            touch-action: none;
        }

        .page-wrapper {
            width: 100%; height: 100%;
            display: flex;
            align-items: stretch;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .mon-conteneur {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Roue mobile : positionnée au centre bas au repos */
        .roue-conteneur {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        /* Quand la roue est ouverte (JS la repositionne via left/top) */
        body.mobile-roue-visible .roue-conteneur {
            pointer-events: auto;
            transform: none;   /* annule translateX(-50%) pour que left JS soit exact */
            bottom: auto;      /* annule bottom:24px pour que top JS soit exact */
        }

        /* ── Bouton tableaux partagés ─────────────────────────────────── */
        #eleve-boards-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--bg, #E8E3DD);
            border: none;
            box-shadow: 5px 5px 14px rgba(0,0,0,0.18), -2px -2px 7px rgba(255,255,255,0.7);
            cursor: pointer;
            color: #888;
            display: flex; align-items: center; justify-content: center;
            z-index: 1100;
            transition: box-shadow 0.12s, color 0.12s;
        }
        #eleve-boards-btn:active { box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15), inset -1px -1px 4px rgba(255,255,255,0.6); color: #ff4000; }
        #eleve-boards-btn svg { width: 20px; height: 20px; display: block; }

        /* ── Overlay plein écran ─────────────────────────────────────── */
        #eleve-boards-overlay {
            display: none;
            position: fixed; inset: 0;
            background: var(--bg, #E8E3DD);
            z-index: 2000;
            flex-direction: column;
            overflow: hidden;
        }
        #eleve-boards-overlay.open { display: flex; }

        /* Header : bouton fermer + titre */
        .eleve-boards-header {
            display: flex;
            align-items: center;
            padding: 18px 16px 10px;
            gap: 10px;
            flex-shrink: 0;
        }
        #eleve-boards-close {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--bg, #E8E3DD); border: none;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.15), -1px -1px 4px rgba(255,255,255,0.7);
            cursor: pointer; color: #888;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: color 0.12s;
        }
        #eleve-boards-close:active { color: #ff4000; }
        #eleve-boards-close svg { width: 16px; height: 16px; }

        /* Barre de recherche plein-largeur */
        .eleve-boards-search {
            flex: 1;
            height: 36px; border-radius: 18px;
            background: var(--bg, #E8E3DD);
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.12), inset -1px -1px 4px rgba(255,255,255,0.6);
            display: flex; align-items: center;
            padding: 0 12px; gap: 6px;
            overflow: hidden;
        }
        .eleve-boards-search svg { width: 14px; height: 14px; color: #aaa; flex-shrink: 0; }
        #eleve-search-input {
            flex: 1; border: none; background: transparent; outline: none;
            font-family: 'DM Sans', sans-serif; font-size: 14px;
            color: #333;
        }
        #eleve-search-input::placeholder { color: #aaa; }

        /* Pastilles matières — pleine largeur */
        .eleve-pills-row {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding: 0 16px 12px;
            flex-shrink: 0;
        }
        .eleve-pill {
            padding: 7px 14px; border-radius: 22px;
            font-size: 12px; font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: -0.02em;
            border: none; cursor: pointer;
            color: #fff; opacity: 0.7;
            flex: 0 0 auto; white-space: nowrap;
            text-align: center;
            transition: opacity 0.15s, transform 0.12s;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }
        .eleve-pill.active { opacity: 1; transform: scale(1.05); }
        .eleve-pill:active  { transform: scale(0.96); }

        /* Liste des tableaux */
        .eleve-boards-list {
            flex: 1; overflow-y: auto;
            padding: 4px 16px 100px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .eleve-board-card {
            display: flex; gap: 12px; align-items: center;
            background: var(--bg, #E8E3DD);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.12), -2px -2px 6px rgba(255,255,255,0.65);
            cursor: pointer;
        }
        .eleve-board-thumb {
            width: 60px; height: 48px; border-radius: 8px;
            object-fit: cover; flex-shrink: 0;
            background: rgba(0,0,0,0.06);
        }
        .eleve-board-thumb-empty {
            width: 60px; height: 48px; border-radius: 8px;
            flex-shrink: 0; background: rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            color: #ccc; font-size: 18px;
        }
        .eleve-board-info { flex: 1; min-width: 0; }
        .eleve-board-label {
            font-family: 'DM Sans', sans-serif; font-size: 15px;
            font-weight: 600; color: #333;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .eleve-board-meta {
            font-family: 'DM Sans', sans-serif; font-size: 11px;
            color: #999; margin-top: 3px;
        }
        .eleve-board-mat-dot {
            display: inline-block;
            width: 8px; height: 8px; border-radius: 50%;
            margin-right: 4px; vertical-align: middle;
        }
        .eleve-boards-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', sans-serif; font-size: 14px;
            color: #aaa; padding: 40px;
            text-align: center; line-height: 1.5;
        }
    </style>
</head>
<body class="mode-eleve">

<div class="page-wrapper">
    <div class="main-wrapper">

        <!-- Panneau gauche — requis par le JS, masqué -->
        <div class="super-conteneur-gauche">
            <div class="cote-gauche">
                <input type="file" id="file-input" multiple accept="image/*,application/pdf" style="display:none;">
                <div class="roue-panel-inline" id="roue-panel">
                    <div class="roue-panel-inner" id="roue-panel-inner"></div>
                </div>
            </div>
        </div>

        <!-- Carrousel tableaux — requis par JS, masqué -->
        <div class="tableau-carrousel" id="tableau-carrousel">
            <div class="tableau-liste" id="tableau-liste"></div>
            <button class="tableau-arc-full-btn" id="tableau-arc-full-btn"></button>
            <button class="tableau-nouveau-btn"  id="tableau-nouveau-btn"></button>
        </div>

        <!-- Roue outil -->
        <div class="roue-conteneur" id="roue-conteneur">
            <div id="roue-hover-pad"></div>
            <div class="roue-top-marker" id="roue-top-marker"></div>
            <svg class="roue-svg" id="roue-svg" viewBox="-1 -1 2 2"></svg>
            <div class="roue-icones" id="roue-icones"></div>
            <svg class="roue-dial-svg" id="roue-dial-svg" viewBox="-1 -1 2 2"></svg>
            <div class="roue-centre" id="roue-centre">
                <span class="roue-centre-label" id="roue-centre-label"></span>
                <div class="roue-centre-chromo"    id="roue-centre-chromo"><div class="chromo-ind"></div></div>
                <div class="roue-centre-fillctrl"  id="roue-centre-fillctrl"></div>
                <div class="roue-centre-textctrl"  id="roue-centre-textctrl"></div>
                <svg class="roue-centre-icone" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
        </div>

        <!-- Zone de dessin principale -->
        <div class="mon-conteneur">
            <div class="carrousel-zone"   id="carrousel-zone"></div>
            <div class="header-wrapper">
                <div class="socket-bouton" id="mobile-logo-socket">
                    <button id="btn-mobile-logo"></button>
                </div>
                <div class="top-bar" id="top-bar"></div>
                <div class="socket-bouton">
                    <button class="conteneur-fichier" id="conteneur-fichier" type="button"></button>
                </div>
                <div class="socket-bouton">
                    <button class="conteneur-oeil" id="conteneur-oeil" title="Masquer le contenu">
                        <svg class="oeil-ouvert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="oeil-ferme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div class="socket-bouton">
                    <button class="btn-archive" id="btn-archive"></button>
                </div>
                <div class="socket-bouton">
                    <button class="conteneur-lumiere" id="conteneur-lumiere" title="Allumer la lumière">
                        <svg class="ampoule-eteinte" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21h6"/><path d="M10 17h4"/>
                            <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6H8.3C6.3 13.7 5 11.5 5 9a7 7 0 0 1 7-7z"/>
                        </svg>
                        <svg class="ampoule-allumee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21h6"/><path d="M10 17h4"/>
                            <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6H8.3C6.3 13.7 5 11.5 5 9a7 7 0 0 1 7-7z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="barre-outils-bas"   id="barre-outils-bas"></div>
            <div class="barre-outils-droite" id="barre-outils-droite"></div>
        </div>

    </div>
</div>

<!-- Archive overlay — requis par JS (ne doit pas être null), masqué -->
<div id="archive-overlay" class="archive-overlay" aria-hidden="true" style="display:none!important">
    <div class="arc-header-bar">
        <button class="top-bar arc-close-btn" id="arc-close-btn"></button>
    </div>
    <div class="arc-sort-panel" id="arc-sort-panel">
        <div class="arc-section-hdr" id="arc-hdr-classe">
            <span class="arc-section-hdr-label" data-arc-expand="classe">Par classe</span>
        </div>
        <div class="arc-ssub" id="arc-ssub-classe"></div>
        <div class="arc-section-hdr" id="arc-hdr-matiere">
            <span class="arc-section-hdr-label" data-arc-expand="matiere">Par matière</span>
        </div>
        <div class="arc-ssub" id="arc-ssub-matiere"></div>
    </div>
    <div class="arc-main-layout" id="arc-main-layout">
        <div class="arc-drum-col">
            <div class="arc-recents" id="arc-recents">
                <span class="arc-recents-label">Récents</span>
                <div class="arc-recents-strip" id="arc-recents-strip"></div>
            </div>
            <div class="arc-drum"       id="arc-drum"></div>
            <div class="arc-drum-count" id="arc-drum-count"></div>
        </div>
        <div class="arc-detail-col"    id="arc-detail-col">
            <div class="arc-detail-header"  id="arc-detail-header"></div>
            <div class="arc-detail-preview" id="arc-detail-preview"></div>
            <div class="arc-detail-meta"    id="arc-detail-meta"></div>
            <div class="arc-detail-resume"  id="arc-detail-resume"></div>
        </div>
    </div>
    <div class="arc-empty" id="arc-empty"></div>
    <div class="arc-chromo-popup" id="arc-chromo-popup"></div>
</div>

<!-- Indicateur sync -->
<div id="sync-dot" style="display:none"></div>

<!-- ── Bouton accès tableaux partagés (élève) ───────────────────────── -->
<button id="eleve-boards-btn" title="Tableaux partagés" aria-label="Tableaux partagés par l'enseignant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
</button>

<!-- ── Overlay tableaux partagés (élève) ────────────────────────────── -->
<div id="eleve-boards-overlay" role="dialog" aria-modal="true" aria-label="Tableaux partagés">
    <div class="eleve-boards-header">
        <button id="eleve-boards-close" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <div class="eleve-boards-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="eleve-search-input" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
        </div>
    </div>
    <div class="eleve-pills-row" id="eleve-pills-row"></div>
    <div class="eleve-boards-list" id="eleve-boards-list"></div>
</div>

<script>
// ── Tableaux partagés — vue élève ─────────────────────────────────────────
(function () {
    const btn      = document.getElementById('eleve-boards-btn');
    const overlay  = document.getElementById('eleve-boards-overlay');
    const closeBtn = document.getElementById('eleve-boards-close');
    const pillsRow = document.getElementById('eleve-pills-row');
    const boardsList = document.getElementById('eleve-boards-list');
    const searchInp  = document.getElementById('eleve-search-input');
    if (!btn || !overlay) return;

    let activeFilter = null; // null = toutes matières
    let searchQ      = '';

    // Matières par défaut — mêmes couleurs que l'espace enseignant
    const MOBILE_DEFAULT_MATIERES = [
        { id:'atc',  abbr:'ATC',     color:'#FF9500' },
        { id:'oln',  abbr:'OLN',     color:'#00C7BE' },
        { id:'amd',  abbr:'AMD',     color:'#0A84FF' },
        { id:'ccda', abbr:'CCDMA',   color:'#FFD60A' },
        { id:'atl',  abbr:'ATELIER', color:'#BF5AF2' },
        { id:'autre',abbr:'Autre',   color:'#8E8E93' },
    ];

    // Pré-remplir les tableaux démo si localStorage vide (première ouverture)
    (function seedDemoBoards() {
        try {
            const existing = JSON.parse(localStorage.getItem('mory_shared_boards') || '[]');
            if (existing.length > 0) return; // déjà des tableaux
            const DEMO = [
                { id:'sd1',  label:'Fondements du Bauhaus',       classeId:'terminale', classeLabel:'Terminale', matiereId:'atc',   matiereLabel:'ATC',     matiereColor:'#FF9500', thumbnail:'apercu/03-Poles-AA_jpo-site_PAV.png',                date: new Date(Date.now()-86400000*1).toISOString()  },
                { id:'sd2',  label:'Couleur & Interaction',        classeId:'terminale', classeLabel:'Terminale', matiereId:'oln',   matiereLabel:'OLN',     matiereColor:'#00C7BE', thumbnail:'apercu/04-Poles-AA_jpo-site_ATC.png',                date: new Date(Date.now()-86400000*2).toISOString()  },
                { id:'sd3',  label:'Typographie Fonctionnelle',    classeId:'premiere',  classeLabel:'Première',  matiereId:'atc',   matiereLabel:'ATC',     matiereColor:'#FF9500', thumbnail:'apercu/06-Poles-AA_jpo-site_OLN.png',                date: new Date(Date.now()-86400000*3).toISOString()  },
                { id:'sd4',  label:'Analyse & Méthodes',           classeId:'premiere',  classeLabel:'Première',  matiereId:'amd',   matiereLabel:'AMD',     matiereColor:'#0A84FF', thumbnail:'apercu/1-2-fiche-catherine-de-robert-1200x.jpg',    date: new Date(Date.now()-86400000*4).toISOString()  },
                { id:'sd5',  label:'Photographie Expérimentale',   classeId:'seconde',   classeLabel:'Seconde',   matiereId:'ccda',  matiereLabel:'CCDMA',   matiereColor:'#FFD60A', thumbnail:'apercu/5bde2b8fbded676d207f632164d513d3.jpg',       date: new Date(Date.now()-86400000*5).toISOString()  },
                { id:'sd6',  label:'Constructivisme & Affiche',    classeId:'terminale', classeLabel:'Terminale', matiereId:'atl',   matiereLabel:'ATELIER', matiereColor:'#BF5AF2', thumbnail:'apercu/84eb8284c9f5ea0de730e3c1c5eabead.jpg',        date: new Date(Date.now()-86400000*6).toISOString()  },
                { id:'sd7',  label:'Ornement & Modernité',         classeId:'seconde',   classeLabel:'Seconde',   matiereId:'oln',   matiereLabel:'OLN',     matiereColor:'#00C7BE', thumbnail:'apercu/bacstd2a.svg',                                date: new Date(Date.now()-86400000*7).toISOString()  },
                { id:'sd8',  label:'Maquettage Architectural',     classeId:'premiere',  classeLabel:'Première',  matiereId:'atl',   matiereLabel:'ATELIER', matiereColor:'#BF5AF2', thumbnail:'apercu/histoire_numerique.png',                      date: new Date(Date.now()-86400000*8).toISOString()  },
                { id:'sd9',  label:'Design Textile & Surface',     classeId:'terminale', classeLabel:'Terminale', matiereId:'ccda',  matiereLabel:'CCDMA',   matiereColor:'#FFD60A', thumbnail:'apercu/std2a_05-672x672.jpg',                        date: new Date(Date.now()-86400000*9).toISOString()  },
                { id:'sd10', label:'Design & Écologie',            classeId:'seconde',   classeLabel:'Seconde',   matiereId:'amd',   matiereLabel:'AMD',     matiereColor:'#0A84FF', thumbnail:'apercu/unnamed.jpg',                                 date: new Date(Date.now()-86400000*10).toISOString() },
            ];
            localStorage.setItem('mory_shared_boards', JSON.stringify(DEMO));
        } catch(e) {}
    })();

    // Charger les matières depuis localStorage (même clé que le prof)
    function loadMatieres() {
        try {
            const stored = JSON.parse(localStorage.getItem('mory_arc_matieres') || 'null');
            if (stored && Array.isArray(stored)) {
                // Synchroniser couleurs vives depuis les defaults
                MOBILE_DEFAULT_MATIERES.forEach(def => {
                    const ex = stored.find(m => m.id === def.id);
                    if (ex) ex.color = def.color;
                    else stored.push(def); // ajouter les nouvelles matières
                });
                return stored;
            }
        } catch(e) {}
        return MOBILE_DEFAULT_MATIERES;
    }

    function loadSharedBoards() {
        try {
            return JSON.parse(localStorage.getItem('mory_shared_boards') || '[]');
        } catch(e) { return []; }
    }

    function renderPills(matieres, sharedBoards) {
        pillsRow.innerHTML = '';
        // Toutes les matières sauf "Autre" dans la version élève
        matieres.filter(m => m.id !== 'autre').forEach(m => {
            const pill = document.createElement('button');
            const isActive = activeFilter === m.id;
            pill.className = 'eleve-pill' + (isActive ? ' active' : '');
            pill.textContent = m.abbr || m.id;
            pill.style.background = m.color || '#888';
            pill.style.opacity = isActive ? '1' : '0.72';
            pill.addEventListener('click', () => {
                activeFilter = (activeFilter === m.id) ? null : m.id;
                renderBoards(matieres, loadSharedBoards());
                renderPills(matieres, loadSharedBoards());
            });
            pillsRow.appendChild(pill);
        });
    }

    function renderBoards(matieres, sharedBoards) {
        boardsList.innerHTML = '';
        let boards = [...sharedBoards];
        // Filtrer
        if (activeFilter) boards = boards.filter(b => b.matiereId === activeFilter);
        if (searchQ)       boards = boards.filter(b => b.label.toLowerCase().includes(searchQ));

        if (boards.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'eleve-boards-empty';
            empty.textContent = sharedBoards.length === 0
                ? 'Aucun tableau partagé pour le moment.\nL\'enseignant peut en partager depuis l\'archive.'
                : 'Aucun tableau ne correspond à cette sélection.';
            boardsList.appendChild(empty);
            return;
        }

        boards.forEach(board => {
            const card = document.createElement('div');
            card.className = 'eleve-board-card';

            if (board.thumbnail) {
                const img = document.createElement('img');
                img.className = 'eleve-board-thumb';
                img.src = board.thumbnail;
                img.alt = board.label;
                card.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'eleve-board-thumb-empty';
                placeholder.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>`;
                card.appendChild(placeholder);
            }

            const info = document.createElement('div');
            info.className = 'eleve-board-info';

            const lbl = document.createElement('div');
            lbl.className = 'eleve-board-label';
            lbl.textContent = board.label;
            info.appendChild(lbl);

            const meta = document.createElement('div');
            meta.className = 'eleve-board-meta';
            const matColor = board.matiereColor || '#888';
            const dot = `<span class="eleve-board-mat-dot" style="background:${matColor}"></span>`;
            const classeStr = board.classeLabel ? `${board.classeLabel} · ` : '';
            meta.innerHTML = `${dot}${classeStr}${board.matiereLabel || board.matiereId}`;
            info.appendChild(meta);

            card.appendChild(info);
            boardsList.appendChild(card);
        });
    }

    function openOverlay() {
        activeFilter = null;
        searchInp.value = '';
        searchQ = '';
        const matieres     = loadMatieres();
        const sharedBoards = loadSharedBoards();
        renderPills(matieres, sharedBoards);
        renderBoards(matieres, sharedBoards);
        overlay.classList.add('open');
        setTimeout(() => searchInp.focus(), 150);
    }

    function closeOverlay() {
        overlay.classList.remove('open');
    }

    btn.addEventListener('click', openOverlay);
    closeBtn.addEventListener('click', closeOverlay);

    searchInp.addEventListener('input', () => {
        searchQ = searchInp.value.toLowerCase().trim();
        const matieres     = loadMatieres();
        const sharedBoards = loadSharedBoards();
        renderBoards(matieres, sharedBoards);
    });
})();
</script>
